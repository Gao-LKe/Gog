name: software-license-marketplace

services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: shop_core
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    environment:
      HTTP_ADDR: :8080
      METRICS_ADDR: ${METRICS_ADDR:-:9091}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      APP_ENV: ${APP_ENV:-development}
      AUTH_ISSUER: ${AUTH_ISSUER:-goblog}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-goblog-api}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      EMAIL_CODE_TTL: ${EMAIL_CODE_TTL:-5m}
      EMAIL_MODE: ${EMAIL_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_COOLDOWN: ${ALERT_COOLDOWN:-30m}
      ALERT_CONSECUTIVE_SAMPLES: ${ALERT_CONSECUTIVE_SAMPLES:-2}
      ALERT_HTTP_MIN_REQUESTS: ${ALERT_HTTP_MIN_REQUESTS:-20}
      ALERT_HTTP_ERROR_RATE: ${ALERT_HTTP_ERROR_RATE:-0.05}
      ALERT_HTTP_P95: ${ALERT_HTTP_P95:-2s}
      RATE_LIMIT_PER_IP: ${RATE_LIMIT_PER_IP:-120}
      MYSQL_DSN: shop:${MYSQL_PASSWORD:-shop_dev_password}@tcp(mysql:3306)/shop_core?parseTime=true
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      ORDER_CONSUMER_WORKERS: ${ORDER_CONSUMER_WORKERS:-8}
      ORDER_TOPIC_PARTITIONS: ${ORDER_TOPIC_PARTITIONS:-8}
    ports:
      - "8081:8080"
    expose:
      - "9091"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  loadtest:
    build: ../backend
    profiles: ["loadtest"]
    entrypoint: ["/loadtest"]
    environment:
      APP_ENV: development
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      AUTH_ISSUER: ${AUTH_ISSUER:-goblog}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-goblog-api}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      EMAIL_CODE_TTL: ${EMAIL_CODE_TTL:-5m}
      EMAIL_MODE: log
      MYSQL_DSN: shop:${MYSQL_PASSWORD:-shop_dev_password}@tcp(mysql:3306)/shop_core?parseTime=true
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ../artifacts/loadtest:/artifacts/loadtest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  frontend:
    build: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  prometheus-data:
