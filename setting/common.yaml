name: "GoBlog"
mode: "dev"
port: 8084
version: "v0.0.1"
start_time: "2025-11-01"
machine_id: 1

auth:
  jwt_expire: 8760
  jwt_secret: "change-me-in-production"

log:
  level: "info"
  common_filename: "./logger/common_log/webServer.log"
  error_filename: "./logger/error_log/webServer.log"
  max_size: 200
  max_age: 30
  max_backups: 7
mysql:
  host: "localhost"
  port: 3306
  user: "root"
  password: "123456"
  dbname: "goblog"
  max_open_conns: 100
  max_idle_conns: 20
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 100

mq:
  kafka:
    enabled: true
    brokers:
      - "127.0.0.1:9092"
    group_id: "goblog-workers"
    # 积分入账 points.earn 单条消息最大尝试次数（仍失败则入 points.earn.dlq 并提交 offset）；重试间隔为指数退避
    points_earn_max_retries: 3
  nsq:
    enabled: true
    addr: "127.0.0.1:4150"
    stats_flush_seconds: 60
    stats_flush_max_keys: 2000
    stats_shard_count: 16
    comment_flush_seconds: 60
    comment_flush_max_keys: 2000

search:
  enabled: false
  host: "http://127.0.0.1:9200"
  api_key: ""
  index: "articles"

security:
  rate_limit_per_minute: 120
  rate_limit_burst: 20
  # 后台内部 API（/api/v1/internal/*）密钥；生产请用环境变量 ADMIN_API_SECRET 覆盖
  admin_api_secret: ""

observability:
  enable_metrics: true
  enable_pprof: false
  pprof_addr: "127.0.0.1:6060"
