services:
  # ====== 开发环境：宿主机源码挂载，go run 在 Docker 网络内 ======
  dev:
    profiles:
      - dev
    image: golang:1.24-alpine
    container_name: goblog-dev
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8084:8084"
    environment:
      - GOPROXY=https://goproxy.cn,direct
      - MODE=dev
      - PORT=8084
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DBNAME=goblog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - MQ_KAFKA_ENABLED=true
      - MQ_KAFKA_BROKERS=kafka:9092
      - MQ_KAFKA_GROUP_ID=goblog-workers
      - MQ_NSQ_ENABLED=true
      - MQ_NSQ_ADDR=nsqd:4150
      - SEARCH_ENABLED=false
      - AUTH_JWT_SECRET=change-me-in-production
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        # 勿用 service_healthy：镜像内 healthcheck 易失败会导致 compose 永久卡在 Waiting
        condition: service_started
    command: sh -c "go mod download && go run ."

  # Vue 前端开发：Vite 热更新，无需本机安装 Node/npm
  webapp-dev:
    profiles:
      - dev
    image: node:22-alpine
    container_name: goblog-webapp-dev
    working_dir: /app
    volumes:
      - ./webapp:/app
      - ./web:/web
      - webapp-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - VITE_DEV_API_TARGET=http://dev:8084
    depends_on:
      - dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # 一次性构建 Vue 产物到 webapp/dist（供 Go 在 8084 托管 SPA）
  # 用法: docker compose --profile dev run --rm webapp-build
  webapp-build:
    profiles:
      - dev
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./webapp:/app
      - ./web:/web
      - webapp-node-modules:/app/node_modules
    environment:
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
    command: sh -c "npm install && npm run build"

  # GoBlog API（Golang）
  app:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    image: goblog-app:latest
    container_name: goblog-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      nsqlookupd:
        condition: service_started
      nsqd:
        condition: service_started
    ports:
      - "8084:8084"
      # pprof：仅发布到宿主机本机（不要对公网开放）
      - "127.0.0.1:6060:6060"
    environment:
      # 生产模式（对应 router.setGinMode(): release）
      - MODE=release
      - PORT=8084

      # pprof（Docker 内监听 0.0.0.0:6060；宿主机仅映射到 127.0.0.1:6060）
      - OBSERVABILITY_ENABLE_PPROF=true
      - OBSERVABILITY_PPROF_ADDR=0.0.0.0:6060

      # MySQL/Redis：容器内使用服务名访问
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DBNAME=goblog

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0

      # MQ（需要就开，不需要可改成 false）
      - MQ_KAFKA_ENABLED=true
      - MQ_KAFKA_BROKERS=kafka:9092
      - MQ_KAFKA_GROUP_ID=goblog-workers

      - MQ_NSQ_ENABLED=true
      - MQ_NSQ_ADDR=nsqd:4150

      # 搜索（不需要可保持 false）
      - SEARCH_ENABLED=false
      - SEARCH_HOST=http://elasticsearch:9200

      # 生产必须覆盖
      - AUTH_JWT_SECRET=change-me-in-production

    # 👇 新增：运行时内存限制（防止泄露拖垮宿主机）
    deploy:
      resources:
        limits:
          memory: 2G # 最大内存，按需调整
        reservations:
          memory: 256M # 预留内存

  # MySQL: 博客主库
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=goblog
      # 如需单独业务账号，可额外设置：
      # - MYSQL_USER=goblog
      # - MYSQL_PASSWORD=your-password
    command: [ "mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci" ]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # 可选：也给 MySQL 加上内存限制
    deploy:
      resources:
        limits:
          memory: 1G

  # Redis: 负责排行榜、点赞计数、缓存
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --save 60 10000 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # 可选：加上内存限制
    deploy:
      resources:
        limits:
          memory: 512M

  # Kafka: 替代 Asynq，用于通知推送/搜索同步等异步任务
  kafka:
    image: apache/kafka:3.8.0
    container_name: blog-kafka
    ports:
      - "9092:9092"
    # 可选：仅用于 docker ps 展示健康状态；PATH 可能无 kafka 脚本，故用容器内绝对路径
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 120s
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1G

  # Elasticsearch: 可选（默认不启动；需要时用 --profile es）
  # elasticsearch:
  #   profiles:
  #     - es
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
  #   container_name: blog-elasticsearch
  #   ports:
  #     - "9200:9200"
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - ES_JAVA_OPTS=-Xms512m -Xmx512m
  #   volumes:
  #     - es_data:/usr/share/elasticsearch/data
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1G

  # NSQ 查找服务: 内部协调
  nsqlookupd:
    image: nsqio/nsq
    container_name: blog-nsqlookupd
    command: /nsqlookupd
    ports:
      - "4160:4160"
      - "4161:4161"
    deploy:
      resources:
        limits:
          memory: 256M

  # NSQ 消息节点: 处理点赞、阅读量流量
  nsqd:
    image: nsqio/nsq
    container_name: blog-nsqd
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd
    depends_on:
      - nsqlookupd
    ports:
      - "4150:4150"
      - "4151:4151"
    deploy:
      resources:
        limits:
          memory: 512M

  # NSQ 监控界面: 浏览器访问 http://127.0.0.1:4171
  nsqadmin:
    image: nsqio/nsq
    container_name: blog-nsqadmin
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    depends_on:
      - nsqlookupd
    ports:
      - "4171:4171"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  es_data:
  go-mod-cache:
  webapp-node-modules:
